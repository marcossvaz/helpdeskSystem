services:
  db:
    image: postgres:16-alpine
    container_name: helpDesk
    restart: unlsess-stopped
    environment:
      POSTGRES_USER: helpDesk
      POSTGRES_PASSWORD: helpDesk
      POSTGRES_DB: helpDesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

redis:
  image: redis:7-alpine
  container_name: heldesk_redis
  restart: unless-stopped
  ports:
    - '6379:6379'
  volumes:
    - redis_data:/data

volumes:
  postres_data:
  redis_data: